<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where To Pee</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --bg2: #eceae4; --bg3: #e4e1d8;
      --text: #1a1a1a; --text2: #666; --text3: #999;
      --wall: #3a3630; --floor: #f0ede6; --tile: #e8e5de;
      --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.2);
      --blue: #378ADD; --blue-bg: #E6F1FB; --blue-text: #0C447C;
      --green: #3B6D11; --green-bg: #EAF3DE; --green-mid: #C0DD97; --green-text: #27500A;
      --red: #A32D2D; --red-bg: #FCEBEB;
      --amber: #EF9F27; --amber-bg: #FAEEDA; --amber-text: #854F0B;
      --person: #E8825A;
      --radius: 8px; --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1918; --bg2: #252320; --bg3: #2a2927;
        --text: #e8e6e0; --text2: #999; --text3: #666;
        --wall: #2a2520; --floor: #1e1c19; --tile: #252320;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LANDING ── */
    #landing-screen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
    }
    .landing-logo  { font-size: 64px; margin-bottom: 1rem; }
    .landing-title { font-size: 32px; font-weight: 600; margin-bottom: 8px; }
    .landing-sub   { font-size: 15px; color: var(--text2); margin-bottom: 2.5rem; }
    .landing-btns  { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
    .landing-btn {
      padding: 14px; border-radius: var(--radius); font-size: 16px; font-weight: 500;
      cursor: pointer; border: none; text-align: center;
    }
    .landing-btn-play  { background: var(--text); color: var(--bg); }
    .landing-btn-play:hover  { opacity: 0.85; }
    .landing-btn-debug { background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border2); }
    .landing-btn-debug:hover { background: var(--bg3); }
    .landing-btn-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

    /* ── RULES SCREEN ── */
    #rules-screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    #rules-screen.show { display: flex; }
    .rules-wrap { width: 100%; max-width: 500px; }
    .rules-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
    .rules-heading { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
    .rules-sub { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; line-height: 1.5; }
    .rules-list { display: flex; flex-direction: column; gap: 0; border-radius: var(--radius-lg); overflow: hidden; border: 0.5px solid var(--border2); margin-bottom: 1.5rem; }
    .rule-row { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
    .rule-row:last-child { border-bottom: none; }
    .rule-row.new-rule { background: var(--blue-bg); }
    .rule-num { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
    .rule-row.new-rule .rule-num { background: var(--blue); }
    .rule-body { flex: 1; }
    .rule-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; color: var(--text); }
    .rule-row.new-rule .rule-name { color: var(--blue-text); }
    .rule-desc { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .rule-tag { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; margin-top: 3px; }
    .tag-hard   { background: var(--red-bg);   color: var(--red); }
    .tag-scored { background: var(--amber-bg); color: var(--amber-text); }
    .new-pill { display: inline-block; background: var(--blue); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; vertical-align: middle; margin-left: 5px; letter-spacing: 0.05em; }
    .rules-cta { width: 100%; padding: 13px; border-radius: var(--radius); background: var(--text); color: var(--bg); border: none; font-size: 15px; font-weight: 500; cursor: pointer; }
    .rules-cta:hover { opacity: 0.85; }

    /* ── GAME ── */
    #game-screen { display: none; }
    #app { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* debug bar — only in debug mode */
    .debug-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .debug-nav { display: flex; gap: 5px; flex-wrap: wrap; }
    .nav-btn { padding: 3px 9px; border-radius: var(--radius); border: 0.5px solid var(--border2); font-size: 11px; cursor: pointer; background: var(--bg); color: var(--text2); }
    .nav-btn:hover  { background: var(--bg2); }
    .nav-btn.active { background: var(--text); color: var(--bg); border-color: transparent; }
    .debug-stats { display: flex; gap: 16px; align-items: center; }
    .dstat { font-size: 12px; }
    .dstat-label { color: var(--text3); }
    .dstat-val { font-weight: 600; margin-left: 3px; }
    .exit-btn { font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 3px 7px; border-radius: var(--radius); }
    .exit-btn:hover { background: var(--bg2); }

    .room-wrap { position: relative; }
    #room-svg { width: 100%; display: block; }
    #countdown-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    #countdown-text { font-size: 80px; font-weight: 700; color: white; text-shadow: 0 2px 20px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.15s; }
    #countdown-text.go { color: #3B6D11; font-size: 56px; }

    /* ── SCORE POPUP ── */
    .score-popup { border-radius: var(--radius-lg); border: 0.5px solid var(--border); background: var(--bg2); padding: 1.25rem; margin-top: 1rem; display: none; }
    .score-popup.show { display: block; }
    .score-title { font-size: 18px; font-weight: 600; margin-bottom: 1rem; }
    .score-rules { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
    .score-rule-row { display: flex; align-items: center; gap: 10px; }
    .score-rule-label { flex: 1; font-size: 13px; color: var(--text2); }
    .score-rule-label b { color: var(--text); font-weight: 500; }
    .score-rule-val { font-size: 13px; font-weight: 600; min-width: 90px; text-align: right; }
    .tick  { color: var(--green); }
    .cross { color: var(--red); }
    .divider { height: 0.5px; background: var(--border); margin: 10px 0; }
    .score-speed { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text2); margin-bottom: 10px; }
    .score-speed-val { font-weight: 600; color: var(--text); }
    .score-total { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .score-total-label { font-size: 14px; font-weight: 600; }
    .score-stars { display: flex; gap: 2px; }
    .sstar { font-size: 20px; color: var(--border2); }
    .sstar.lit { color: var(--amber); }
    .score-feedback { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .actions { display: flex; gap: 8px; margin-top: 1rem; }
    .btn { padding: 9px 20px; border-radius: var(--radius); border: 0.5px solid var(--border2); font-size: 14px; cursor: pointer; background: var(--bg); color: var(--text); }
    .btn:hover { background: var(--bg2); }
    .btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
    .btn-primary:hover { opacity: 0.85; }

    /* ── DEBUG TABLE ── */
    .debug-wrap { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow-x: auto; margin-top: 1rem; display: none; }
    .debug-wrap.show { display: block; }
    .weights-bar { padding: 10px 14px; border-bottom: 0.5px solid var(--border); display: flex; gap: 20px; flex-wrap: wrap; align-items: center; background: var(--bg2); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .weight-row { display: flex; align-items: center; gap: 8px; }
    .weight-label { font-size: 11px; font-weight: 500; color: var(--text2); white-space: nowrap; min-width: 90px; }
    .weight-val { font-size: 12px; font-weight: 500; min-width: 16px; }
    input[type=range] { width: 80px; }
    .debug-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    .debug-table th { padding: 6px 4px; text-align: center; font-weight: 500; font-size: 11px; color: var(--text2); border-bottom: 0.5px solid var(--border); background: var(--bg2); }
    .debug-table th.rl { text-align: left; padding-left: 10px; width: 120px; }
    .debug-table td { padding: 6px 4px; text-align: center; border-bottom: 0.5px solid var(--border); vertical-align: middle; line-height: 1.4; }
    .debug-table td.rl { text-align: left; padding-left: 10px; font-size: 11px; font-weight: 500; color: var(--text2); background: var(--bg2); border-right: 0.5px solid var(--border); white-space: nowrap; }
    .debug-table tr:last-child td { border-bottom: none; }
    .debug-table td.cb { background: var(--green-mid); color: var(--green-text); }
    .debug-table td.cd, .debug-table td.ci { background: var(--bg2); }
    .pill { display: inline-block; padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: 500; }
    .pp { background: var(--green-bg); color: var(--green); }
    .pm { background: var(--blue-bg); color: var(--blue-text); }
    .pf { background: var(--red-bg); color: var(--red); }
    .pn { background: var(--bg2); color: var(--text3); border: 0.5px solid var(--border); }
    .pw { background: var(--amber-bg); color: var(--amber-text); }
    .sm { color: var(--amber); font-size: 12px; }
    .se { color: var(--border2); font-size: 12px; }
  </style>
</head>
<body>

<!-- LANDING -->
<div id="landing-screen">
  <div class="landing-logo">🚾</div>
  <div class="landing-title">Where To Pee</div>
  <div class="landing-sub">The unwritten rules of the urinal.</div>
  <div class="landing-btns">
    <div>
      <button class="landing-btn landing-btn-play" onclick="startPlay()">Play</button>
    </div>
    <div>
      <button class="landing-btn landing-btn-debug" onclick="startDebug()">Debug mode</button>
    </div>
  </div>
</div>

<!-- RULES SCREEN -->
<div id="rules-screen">
  <div class="rules-wrap">
    <div class="rules-eyebrow" id="rules-eyebrow">Before you go in</div>
    <div class="rules-heading" id="rules-heading">The Golden Rules</div>
    <div class="rules-sub" id="rules-sub">Know these before you step inside.</div>
    <div class="rules-list" id="rules-list"></div>
    <button class="rules-cta" id="rules-cta" onclick="startLevelFromRules()">Let's go →</button>
  </div>
</div>

<!-- GAME -->
<div id="game-screen">
  <div id="app">

    <!-- Debug top bar (hidden in play mode) -->
    <div id="debug-topbar" class="debug-topbar" style="display:none">
      <div id="debug-nav" class="debug-nav"></div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="debug-stats">
          <span class="dstat"><span class="dstat-label">⭐</span><span class="dstat-val" id="stat-stars">0</span></span>
          <span class="dstat"><span class="dstat-label">⏱</span><span class="dstat-val" id="stat-time">—</span></span>
          <span class="dstat"><span class="dstat-label">best</span><span class="dstat-val" id="stat-best">—</span></span>
        </div>
        <button class="exit-btn" onclick="goLanding()">← exit</button>
      </div>
    </div>

    <div class="room-wrap">
      <svg id="room-svg" viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="countdown-overlay"><span id="countdown-text"></span></div>
    </div>

    <!-- Score popup -->
    <div class="score-popup" id="score-popup">
      <div class="score-title" id="score-title"></div>
      <div class="score-rules" id="score-rules"></div>
      <div class="divider"></div>
      <div class="score-speed">
        <span>⏱ Reaction time</span>
        <span class="score-speed-val" id="score-speed">—</span>
      </div>
      <div class="divider"></div>
      <div class="score-total">
        <span class="score-total-label">Score</span>
        <div class="score-stars" id="score-stars"></div>
      </div>
      <div class="score-feedback" id="score-feedback"></div>
      <div class="actions">
        <button class="btn btn-primary" id="next-btn" style="display:none" onclick="nextLevel()">Next level →</button>
        <button class="btn" id="retry-btn" style="display:none" onclick="retryLevel()">Try again</button>
      </div>
    </div>

    <!-- Debug table (debug mode only) -->
    <div class="debug-wrap" id="debug-wrap">
      <div class="weights-bar">
        <div class="weight-row"><span class="weight-label">R3 next spots</span><input type="range" min="1" max="4" value="2" id="w-r3" oninput="onWC()"><span class="weight-val" id="wv-r3">2</span></div>
        <div class="weight-row"><span class="weight-label">R4 entrance</span><input type="range" min="1" max="4" value="2" id="w-r4" oninput="onWC()"><span class="weight-val" id="wv-r4">2</span></div>
        <div class="weight-row"><span class="weight-label">R5 distance</span><input type="range" min="1" max="4" value="1" id="w-r5" oninput="onWC()"><span class="weight-val" id="wv-r5">1</span></div>
      </div>
      <table class="debug-table" id="debug-table"></table>
    </div>

  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────
let isDebugMode = false;
let currentLevel = 0;
let completedLevels = [];
let picked = null, revealed = false, hoveredIdx = null;
let goTime = null, reactionTime = null, totalStars = 0, bestReaction = null;
let countingDown = false, animFrame = null;
let pendingLevel = 0;

// ── RULES ─────────────────────────────────────────────
const RULES = [
  { name:'R1 — Leave a buffer',       desc:'Whenever possible, leave an empty "buffer" between you and others.',                        type:'hard',   tag:'✓ / ✗' },
  { name:'R2 — Don\'t trap anyone',   desc:'Whenever possible, don\'t squeeze someone between two occupied stalls.',                    type:'hard',   tag:'✓ / ✗' },
  { name:'R3 — Think ahead',          desc:'Don\'t put an upcoming person into an unavoidable buffer violation.',                       type:'hard',   tag:'✓ / ✗' },
  { name:'R4 — Stay inconspicuous',   desc:'Don\'t be the creepy "hiding something shameful" guy — avoid lurking at extremes.',        type:'scored', tag:'★★★★★' },
  { name:'R5 — Don\'t over-walk',     desc:'Minimise walking distance while staying aware of the entrance.',                           type:'scored', tag:'★★★★★' },
];

// ── LANDING ───────────────────────────────────────────
function startPlay() {
  isDebugMode = false;
  document.getElementById('landing-screen').style.display = 'none';
  showRulesScreen(0, true);
}
function startDebug() {
  isDebugMode = true;
  document.getElementById('landing-screen').style.display = 'none';
  currentLevel = 0;
  document.getElementById('game-screen').style.display = 'block';
  document.getElementById('debug-topbar').style.display = 'flex';
  document.getElementById('debug-wrap').classList.add('show');
  renderLevel();
}
function goLanding() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('rules-screen').classList.remove('show');
  document.getElementById('landing-screen').style.display = 'flex';
}

// ── RULES SCREEN ──────────────────────────────────────
// rulesCount = how many rules to show (1–5)
// newRuleIdx = which rule is highlighted as NEW (0-based), or null
function showRulesScreen(levelIdx, isFirst) {
  pendingLevel = levelIdx;
  const rulesCount = Math.min(levelIdx + 1, RULES.length); // L0→1 rule, L1→2, etc.
  const newRuleIdx = levelIdx < RULES.length ? levelIdx : null;

  document.getElementById('rules-eyebrow').textContent = isFirst ? 'Before you go in' : `Level ${levelIdx + 1}`;
  document.getElementById('rules-heading').textContent = isFirst ? 'The Golden Rules' : 'New rule unlocked!';
  document.getElementById('rules-sub').textContent = isFirst
    ? 'One rule at a time. Master each before moving on.'
    : `You've learned ${rulesCount} rule${rulesCount > 1 ? 's' : ''} so far.`;
  document.getElementById('rules-cta').textContent = `Play Level ${levelIdx + 1} →`;

  document.getElementById('rules-list').innerHTML = RULES.slice(0, rulesCount).map((r, i) => {
    const isNew = i === newRuleIdx;
    const tagCls = r.type === 'hard' ? 'tag-hard' : 'tag-scored';
    return `<div class="rule-row${isNew ? ' new-rule' : ''}">
      <div class="rule-num">R${i+1}</div>
      <div class="rule-body">
        <div class="rule-name">${r.name}${isNew ? '<span class="new-pill">NEW</span>' : ''}</div>
        <div class="rule-desc">${r.desc}</div>
      </div>
      <div class="rule-tag ${tagCls}">${r.tag}</div>
    </div>`;
  }).join('');

  document.getElementById('rules-screen').classList.add('show');
  document.getElementById('game-screen').style.display = 'none';
}

function startLevelFromRules() {
  document.getElementById('rules-screen').classList.remove('show');
  currentLevel = pendingLevel;
  document.getElementById('game-screen').style.display = 'block';
  renderLevel();
}

// ── COLOURS ───────────────────────────────────────────
function isDark() { return window.matchMedia('(prefers-color-scheme:dark)').matches; }
function C(l,d) { return isDark() ? d : l; }
const COL = {
  wall:        () => C('#3a3630','#2a2520'),
  floor:       () => C('#f0ede6','#1e1c19'),
  tile:        () => C('#e8e5de','#252320'),
  urinalBg:    () => C('#ffffff','#2a2927'),
  urinalBorder:() => C('#b0ada6','#5a5855'),
  occupied:    () => C('#e8e5de','#1e1c19'),
  numberText:  () => C('#999','#666'),
  doorFill:    () => C('#f0ede6','#1e1c19'),
  doorBorder: '#378ADD', doorText: '#378ADD',
  personFill: '#E8825A',
  passStall: '#EAF3DE', passStallBorder: '#3B6D11',
  failStall: '#FCEBEB', failStallBorder: '#A32D2D',
  selectedBorder: '#378ADD',
  playerDot: '#378ADD', npcDot: '#E8534A',
};

// ── SCORING HELPERS ───────────────────────────────────
function isAdjOcc(i,s){ return (i>0&&s[i-1].status==='occupied')||(i<s.length-1&&s[i+1].status==='occupied'); }
function minDist(i,s){ const o=s.map((x,j)=>x.status==='occupied'?j:null).filter(x=>x!==null); if(!o.length)return 999; return Math.min(...o.map(j=>Math.abs(i-j))); }
function nextSpots(pick,s){ let c=0; for(let i=0;i<s.length;i++){ if(s[i].status!=='empty'||i===pick)continue; const lb=(i>0)&&(s[i-1].status==='occupied'||i-1===pick); const rb=(i<s.length-1)&&(s[i+1].status==='occupied'||i+1===pick); if(!lb&&!rb)c++; } return c; }
function anyNonAdj(s){ return s.some((x,i)=>x.status==='empty'&&!isAdjOcc(i,s)); }
function maxSurround(pick,s){ let mx=0; for(let i=0;i<s.length;i++){ if(s[i].status!=='occupied')continue; const l=(i>0)&&(s[i-1].status==='occupied'||i-1===pick); const r=(i<s.length-1)&&(s[i+1].status==='occupied'||i+1===pick); mx=Math.max(mx,(l?1:0)+(r?1:0)); } return mx; }
function anyAvoidSurround(s){ return s.some((x,i)=>x.status==='empty'&&maxSurround(i,s)<2); }
function distScore(d,mx){ if(mx===999)return 1; return d>=Math.ceil(mx*0.6)?1:0; }
function bellZone(i,s,door){ if(door===null||door===undefined)return null; const p=Math.abs(i-door)/(s.length-1||1); if(p<0.15)return 0; if(p<0.25)return 1; if(p<=0.60)return 2; if(p<=0.80)return 1; return 0; }
function bellLabel(v){ return['too close/far','ok','sweet spot'][v]; }
function walkDist(i,door){ if(door===null||door===undefined)return 0; return Math.abs(i-door); }
function gW(){ return{r3:+document.getElementById('w-r3').value,r4:+document.getElementById('w-r4').value,r5:+document.getElementById('w-r5').value}; }

function bd(i,s,door,w){
  const x=s[i];
  if(x.status==='occupied')return{eligible:false};
  if(x.status==='broken')return{eligible:false};
  const hasOcc=s.some(v=>v.status==='occupied');
  const canAvoid=anyNonAdj(s); const adj=isAdjOcc(i,s);
  const r1app=hasOcc&&canAvoid; const r1pass=!r1app||!adj;
  const surr=maxSurround(i,s); const canAvoidSurr=anyAvoidSurround(s); const r2disq=surr>=2&&canAvoidSurr;
  const myDist=minDist(i,s); const mySpots=nextSpots(i,s);
  const myRecent=!!x.recent; const myBell=bellZone(i,s,door); const myWalk=walkDist(i,door);
  if(!r1pass) return{eligible:true,disqualified:true,disqR:'r1',r1pass:false,r1app,surr,dist:myDist,spots:mySpots,bell:myBell,walk:myWalk,recent:myRecent,finalStars:1,r1Stars:0,r2Stars:1,r3Stars:1,r4Stars:null,r5Stars:0};
  if(r2disq)  return{eligible:true,disqualified:true,disqR:'r2',r1pass:true, r1app,surr,dist:myDist,spots:mySpots,bell:myBell,walk:myWalk,recent:myRecent,finalStars:1,r1Stars:1,r2Stars:0,r3Stars:1,r4Stars:null,r5Stars:0};
  const cands=s.map((_,j)=>{
    if(s[j].status!=='empty')return null;
    if(hasOcc&&canAvoid&&isAdjOcc(j,s))return null;
    if(maxSurround(j,s)>=2&&canAvoidSurr)return null;
    return j;
  }).filter(v=>v!==null);
  const mxDist=cands.length?Math.max(...cands.map(j=>minDist(j,s))):0;
  const mxSpots=cands.length?Math.max(...cands.map(j=>nextSpots(j,s))):0;
  const r3r=mySpots===mxSpots?1:mySpots>=mxSpots-1?0.5:0;
  const r3p=r3r*w.r3; const r3pass=r3r>=0.5;
  const r4r=myBell===null?null:myBell===2?1:myBell===1?0.5:0;
  const r4p=r4r===null?0:r4r*w.r4;
  const r5r=distScore(myDist,mxDist); const r5p=r5r*w.r5;
  const pen=myRecent?-1:0;
  const raw=r3p+r4p+r5p+pen;
  const mxRaw=w.r3+(door!==null&&door!==undefined?w.r4:0)+w.r5;
  const pct=mxRaw===0?0.8:raw/mxRaw;
  let fs=pct>=0.8?5:pct>=0.6?4:pct>=0.4?3:2;
  const minW=cands.length?Math.min(...cands.map(j=>walkDist(j,door))):0;
  const maxW=cands.length?Math.max(...cands.map(j=>walkDist(j,door))):0;
  const walkTieLabel=door===null?null:myWalk===minW?'closest':myWalk===maxW?'furthest':'mid';
  return{
    eligible:true,disqualified:false,r1pass:true,r1app,surr,canAvoidSurr,
    dist:myDist,mxDist,spots:mySpots,mxSpots,bell:myBell,walk:myWalk,
    walkTieLabel,recent:myRecent,pen,raw,mxRaw,finalStars:fs,
    r3r,r3p,r3pass,r4r,r4p,r5r,r5p,
    r1Stars:1, r2Stars:1,
    r3Stars:r3pass?1:0,
    r4Stars:r4r===null?null:Math.round(r4r*5),
    r5Stars:Math.round(r5r*5),
  };
}

function scoreStall(i,s,d,w){ const b=bd(i,s,d,w); return b.eligible?b.finalStars:0; }

function bests(s,door,w){
  const scored=s.map((_,i)=>{
    if(s[i].status!=='empty')return{i,stars:0,walk:999};
    const b=bd(i,s,door,w);
    return{i,stars:b.eligible?b.finalStars:0,walk:b.eligible&&!b.disqualified?walkDist(i,door):999};
  });
  const mx=Math.max(...scored.map(x=>x.stars));
  if(mx===0)return[];
  const top=scored.filter(x=>x.stars===mx);
  const minW=Math.min(...top.map(x=>x.walk));
  return top.filter(x=>x.walk===minW).map(x=>x.i);
}

// Returns true if picking stall i is a "pass" (≥2 stars and not disqualified)
function isPass(i,s,door,w){
  if(s[i].status!=='empty')return false;
  const b=bd(i,s,door,w);
  return b.eligible&&!b.disqualified&&b.finalStars>=2;
}

function stH(n,m){ return`<span class="sm">${'★'.repeat(Math.max(0,n))}</span><span class="se">${'★'.repeat(Math.max(0,m-n))}</span>`; }

// ── SVG ROOM ──────────────────────────────────────────
const SVG_W=560,SVG_H=220,WALL=14,UW=44,UH=54,PW=7,PH=10,DW=36;
const URINAL_MID_Y=WALL+4+PH+UH/2-4;

function roomX(i,n){ const tw=n*UW+(n-1)*8; return (SVG_W-tw)/2+i*(UW+8); }
function urinalCX(i,n){ return roomX(i,n)+UW/2; }

// passMap: null = no colouring; otherwise array of bool per stall index
function drawRoom(stalls,door,hov,selIdx,passMap,animDots){
  const n=stalls.length; let o='';
  // Floor + tiles
  o+=`<rect x="0" y="0" width="${SVG_W}" height="${SVG_H}" fill="${COL.floor()}"/>`;
  for(let x=WALL;x<SVG_W-WALL;x+=30) o+=`<line x1="${x}" y1="${WALL}" x2="${x}" y2="${SVG_H-WALL}" stroke="${COL.tile()}" stroke-width="1"/>`;
  for(let y=WALL;y<SVG_H-WALL;y+=30) o+=`<line x1="${WALL}" y1="${y}" x2="${SVG_W-WALL}" y2="${y}" stroke="${COL.tile()}" stroke-width="1"/>`;
  // Walls
  o+=`<rect x="0" y="0" width="${SVG_W}" height="${WALL}" fill="${COL.wall()}"/>`;
  o+=`<rect x="0" y="0" width="${WALL}" height="${SVG_H}" fill="${COL.wall()}"/>`;
  o+=`<rect x="${SVG_W-WALL}" y="0" width="${WALL}" height="${SVG_H}" fill="${COL.wall()}"/>`;
  // Door / bottom wall
  if(door!==null&&door!==undefined){
    const dx=roomX(door,n)+UW/2-DW/2;
    o+=`<rect x="0" y="${SVG_H-WALL}" width="${dx}" height="${WALL}" fill="${COL.wall()}"/>`;
    o+=`<rect x="${dx+DW}" y="${SVG_H-WALL}" width="${SVG_W-(dx+DW)}" height="${WALL}" fill="${COL.wall()}"/>`;
    o+=`<rect x="${dx}" y="${SVG_H-WALL}" width="${DW}" height="${WALL}" fill="${COL.doorFill()}"/>`;
    o+=`<line x1="${dx}" y1="${SVG_H-WALL}" x2="${dx}" y2="${SVG_H}" stroke="${COL.doorBorder}" stroke-width="2"/>`;
    o+=`<line x1="${dx+DW}" y1="${SVG_H-WALL}" x2="${dx+DW}" y2="${SVG_H}" stroke="${COL.doorBorder}" stroke-width="2"/>`;
    o+=`<path d="M${dx} ${SVG_H-WALL} Q${dx+DW/2} ${SVG_H-WALL-20} ${dx+DW} ${SVG_H-WALL}" stroke="${COL.doorBorder}" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>`;
    o+=`<text x="${dx+DW/2}" y="${SVG_H-2}" text-anchor="middle" font-size="9" fill="${COL.doorText}" font-family="sans-serif">entrance</text>`;
  } else {
    o+=`<rect x="0" y="${SVG_H-WALL}" width="${SVG_W}" height="${WALL}" fill="${COL.wall()}"/>`;
  }
  // Stalls
  for(let i=0;i<n;i++){
    const s=stalls[i]; const ux=roomX(i,n); const uy=WALL+4; const cx=ux+UW/2;
    const isOcc=s.status==='occupied', isBrk=s.status==='broken';
    const isHov=!revealed&&!countingDown&&hov===i&&!isOcc&&!isBrk;
    const isPicked=selIdx===i;
    // Determine colours
    let bg=COL.urinalBg(), bc=COL.urinalBorder(), bw=1.5;
    if(isOcc||isBrk){ bg=COL.occupied(); }
    else if(passMap!==null&&!isOcc&&!isBrk){
      // Revealed: show pass/fail across all available stalls
      bg = passMap[i] ? COL.passStall : COL.failStall;
      bc = passMap[i] ? COL.passStallBorder : COL.failStallBorder;
      bw = 2;
    } else if(isHov){ bc='#378ADD'; bw=2; }
    const by=uy+PH; const tap=4;
    const clickable=!isOcc&&!isBrk&&!revealed&&!countingDown;
    const op=isBrk?'0.4':'1';
    o+=`<rect x="${cx-PW/2}" y="${uy}" width="${PW}" height="${PH}" rx="2" fill="${COL.urinalBorder()}"/>`;
    o+=`<g onclick="${clickable?`clickUrinal(${i})`:''}" style="cursor:${clickable?'pointer':'default'}" opacity="${op}">`;
    o+=`<path d="M${ux+2} ${by} L${ux+UW-2} ${by} L${ux+UW-2-tap} ${by+UH} L${ux+2+tap} ${by+UH} Z" fill="${bg}" stroke="${bc}" stroke-width="${bw}"/>`;
    o+=`<path d="M${ux+8} ${by+8} L${ux+UW-6} ${by+8} L${ux+UW-tap-6} ${by+UH-8} L${ux+tap+2} ${by+UH-8} Z" fill="none" stroke="${bc}" stroke-width="0.8" opacity="0.5"/>`;
    o+=`<circle cx="${cx}" cy="${by+UH-14}" r="2.5" fill="${bc}" opacity="0.4"/>`;
    if(isBrk) o+=`<text x="${cx}" y="${by+UH/2+5}" text-anchor="middle" font-size="16" font-family="sans-serif">🔧</text>`;
    else if(isOcc){ o+=`<circle cx="${cx}" cy="${by+UH/2-4}" r="11" fill="${COL.personFill}"/><circle cx="${cx}" cy="${by+UH/2-4}" r="5" fill="#fff" opacity="0.4"/>`; }
    else if(passMap!==null){
      // Show ✓ on picked stall, simple colour otherwise
      if(isPicked) o+=`<text x="${cx}" y="${by+UH/2+6}" text-anchor="middle" font-size="16" fill="${passMap[i]?COL.passStallBorder:COL.failStallBorder}" font-weight="700" font-family="sans-serif">${passMap[i]?'✓':'✗'}</text>`;
    }
    else if(s.recent) o+=`<text x="${cx}" y="${by+10}" text-anchor="middle" font-size="9" fill="#854F0B" font-family="sans-serif">recent</text>`;
    o+=`</g>`;
    o+=`<text x="${cx}" y="${by+UH+14}" text-anchor="middle" font-size="11" fill="${COL.numberText()}" font-family="sans-serif">${i+1}</text>`;
  }
  // Animated dots
  if(animDots){ for(const d of animDots){ o+=`<circle cx="${d.cx}" cy="${d.cy}" r="${d.r||11}" fill="${d.color}"/><circle cx="${d.cx}" cy="${d.cy}" r="${(d.r||11)*0.45}" fill="#fff" opacity="0.4"/>`; } }
  document.getElementById('room-svg').innerHTML=o;
}

// ── COUNTDOWN ─────────────────────────────────────────
function lerp(a,b,t){ return a+(b-a)*t; }
function showCD(txt,isGo){ const el=document.getElementById('countdown-text'); el.textContent=txt; el.className=isGo?'go':''; el.style.opacity='1'; setTimeout(()=>el.style.opacity='0',isGo?600:700); }
function hideCD(){ document.getElementById('countdown-text').style.opacity='0'; }

function runCountdown(lv){
  countingDown=true; goTime=null;
  const n=lv.stalls.length;
  const door=lv.doorIndex??0;
  const npcTarget=lv.npcArrival?.urinal??null;
  const doorX=urinalCX(door,n), doorY=SVG_H-WALL-8;
  const waitX=doorX, waitY=SVG_H-WALL-30;
  let playerDot={cx:doorX,cy:doorY,color:COL.playerDot,r:11};
  let npcDot=null;
  window._playerWaitPos={cx:waitX,cy:waitY};
  const T={p0:200,p1:900,two:1000,one:2000,n0:2100,n1:2700,go:3000,done:3400};
  setTimeout(()=>showCD('3'),0);
  setTimeout(()=>showCD('2'),T.two);
  setTimeout(()=>showCD('1'),T.one);
  setTimeout(()=>{ showCD('GO',true); goTime=performance.now(); },T.go);
  const t0=performance.now();
  function tick(now){
    const el=now-t0;
    if(el>=T.p0&&el<T.p1){ const t=(el-T.p0)/(T.p1-T.p0),e=t<0.5?2*t*t:-1+(4-2*t)*t; playerDot.cx=lerp(doorX,waitX,e); playerDot.cy=lerp(doorY,waitY,e); }
    else if(el>=T.p1){ playerDot.cx=waitX; playerDot.cy=waitY; }
    if(npcTarget!==null){
      const nx=urinalCX(npcTarget,n);
      if(el>=T.n0&&el<T.n1){ if(!npcDot)npcDot={cx:doorX,cy:doorY,color:COL.npcDot,r:11}; const t=(el-T.n0)/(T.n1-T.n0),e=1-Math.pow(1-t,2.5); npcDot.cx=lerp(doorX,nx,e); npcDot.cy=lerp(doorY,URINAL_MID_Y,e); }
      else if(el>=T.n1&&npcDot){ npcDot.cx=nx; npcDot.cy=URINAL_MID_Y; }
    }
    drawRoom(lv.stalls,door,null,null,null,[playerDot,...(npcDot?[npcDot]:[])]);
    if(el<T.done){ animFrame=requestAnimationFrame(tick); }
    else{
      countingDown=false;
      if(npcTarget!==null) lv.stalls[npcTarget]={status:'occupied'};
      drawRoom(lv.stalls,door,null,null,null,[playerDot]);
      renderDebug();
    }
  }
  animFrame=requestAnimationFrame(tick);
}

function animatePlayerWalk(stalls,door,pickedIdx,onComplete){
  const n=stalls.length;
  const sp=window._playerWaitPos||{cx:urinalCX(door??0,n),cy:SVG_H-WALL-30};
  const dx=urinalCX(pickedIdx,n), dy=URINAL_MID_Y;
  const t0=performance.now(), DUR=700;
  function tick(now){
    const t=Math.min(1,(now-t0)/DUR), e=t<0.5?2*t*t:-1+(4-2*t)*t;
    drawRoom(stalls,door,null,null,null,[{cx:lerp(sp.cx,dx,e),cy:lerp(sp.cy,dy,e),color:COL.playerDot,r:11}]);
    t<1?animFrame=requestAnimationFrame(tick):(animFrame=null,onComplete());
  }
  animFrame=requestAnimationFrame(tick);
}

// ── SCORE POPUP ───────────────────────────────────────
// rulesShown: how many rules to show in popup (null = all 5)
function showScorePopup(pick, stalls, door, w, rulesShown) {
  const b = bd(pick, stalls, door, w);
  const stars = b.eligible ? b.finalStars : 0;
  const hasOcc = stalls.some(s => s.status === 'occupied');
  const hasDoor = door !== null && door !== undefined;
  const count = rulesShown ?? RULES.length; // how many rule rows to show

  const titles = {5:'Perfect! 🎉',4:'Very good 👍',3:'Acceptable 😐',2:'Below average 😬',1:'Rule broken! ❌'};
  document.getElementById('score-title').textContent = titles[stars] || '—';

  function starRow(val, max=5) {
    return Array.from({length:max},(_,i)=>`<span style="color:${i<val?'var(--amber)':'var(--border2)'};font-size:15px">★</span>`).join('');
  }
  function ruleRow(num, label, type, val) {
    // val: for hard = bool, for scored = 0-5 or null (n/a)
    let valHtml;
    if(val===null) valHtml=`<span style="color:var(--text3);font-size:12px;font-style:italic">n/a</span>`;
    else if(type==='hard') valHtml=val?`<span class="tick">✓ Pass</span>`:`<span class="cross">✗ Fail</span>`;
    else valHtml=starRow(val);
    return `<div class="score-rule-row">
      <span class="score-rule-label"><b>R${num}</b> — ${label}</span>
      <span class="score-rule-val">${valHtml}</span>
    </div>`;
  }

  // Compute per-rule values
  const r1val = !b.r1app ? null : b.r1pass;
  const r2val = !hasOcc  ? null : b.disqualified&&b.disqR==='r2' ? false : b.surr<2;
  const r3val = b.disqualified ? false : b.r3pass;
  const r4val = !hasDoor ? null : b.r4Stars;
  const r5val = b.r5Stars;

  const ruleData = [
    [1,'Leave a buffer','hard',r1val],
    [2,"Don't trap anyone",'hard',r2val],
    [3,'Think ahead','hard',r3val],
    [4,'Stay inconspicuous','scored',r4val],
    [5,"Don't over-walk",'scored',r5val],
  ];

  document.getElementById('score-rules').innerHTML = ruleData.slice(0,count).map(r=>ruleRow(...r)).join('');
  document.getElementById('score-speed').textContent = reactionTime!==null?(reactionTime/1000).toFixed(2)+'s':'—';
  document.getElementById('score-stars').innerHTML = Array.from({length:5},(_,i)=>`<span class="sstar${i<stars?' lit':''}">★</span>`).join('');

  // Feedback
  let fb='';
  if(stars===5) fb='Textbook. Every rule respected.';
  else if(b.disqualified&&b.disqR==='r1') fb='A stall with a buffer gap was available.';
  else if(b.disqualified&&b.disqR==='r2') fb='Your pick fully surrounds someone. Avoidable.';
  else if(stars===4){ const bn=bests(stalls,door,w).map(x=>x+1).join(' or '); fb=`Solid. Stall${bn.includes('or')?'s':''} ${bn} was slightly better.`; }
  else if(stars===3) fb=`Acceptable. Left ${b.spots??'?'} valid spot(s) for the next person.`;
  else if(b.spots===0) fb='You trapped the next guy — zero valid spots left!';
  else if(hasDoor&&b.bell===0) fb='Too close to the entrance, or suspiciously far away.';
  else fb='One or more rules scored poorly.';
  document.getElementById('score-feedback').textContent = fb;

  document.getElementById('score-popup').classList.add('show');

  // Update session stats
  totalStars += stars;
  if(isDebugMode) updateDebugStats();

  // Buttons
  document.getElementById('next-btn').style.display='none';
  document.getElementById('retry-btn').style.display='none';

  if(stars>=2){
    completedLevels=[...new Set([...completedLevels,currentLevel])];
    if(isDebugMode) renderNav();
    const nb=document.getElementById('next-btn');
    nb.style.display='inline-block';
    // For tutorial levels (0-4), show rules screen for next level
    if(!isDebugMode && currentLevel<4){
      nb.textContent=`See Rule ${currentLevel+2} →`;
      nb.onclick=()=>{
        document.getElementById('score-popup').classList.remove('show');
        showRulesScreen(currentLevel+1,false);
      };
    } else {
      nb.textContent=currentLevel<LEVELS.length-1?'Next level →':'Play again ↺';
      nb.onclick=()=>nextLevel();
    }
  } else {
    document.getElementById('retry-btn').style.display='inline-block';
  }
}

function renderDebug(){
  if(!isDebugMode)return;
  const{stalls,doorIndex}=LEVELS[currentLevel];
  const w=gW(); const best=bests(stalls,doorIndex,w);
  const bds=stalls.map((_,i)=>bd(i,stalls,doorIndex,w));
  function cc(i){ if(!bds[i].eligible)return'ci'; if(bds[i].disqualified)return'cd'; if(best.includes(i))return'cb'; return''; }
  const na=`<span style="color:var(--text3)">—</span>`;
  const hc=stalls.map((_,i)=>`<th>#${i+1}</th>`).join('');
  function row(lbl,cells){ return`<tr><td class="rl">${lbl}</td>${cells.map((c,i)=>`<td class="${cc(i)}">${c}</td>`).join('')}</tr>`; }
  const hasOcc=stalls.some(s=>s.status==='occupied');
  const sc=stalls.map(s=>s.status==='occupied'?`<span class="pill pn">occ</span>`:s.status==='broken'?`<span class="pill pn">brk</span>`:s.recent?`<span class="pill pw">recent</span>`:`<span class="pill pp">empty</span>`);
  const r1c=bds.map(b=>!b.eligible?na:!b.r1app?`<span class="pill pn">n/a</span>`:b.r1pass?`<span class="pill pp">ok ✓</span>`:`<span class="pill pf">adj ✗</span>`);
  const r2c=bds.map(b=>!b.eligible?na:!hasOcc?`<span class="pill pn">n/a</span>`:(b.disqualified&&b.disqR==='r2')||b.surr>=2?`<span class="pill pf">surr ✗</span>`:`<span class="pill pp">ok ✓</span>`);
  const r3c=bds.map(b=>!b.eligible?na:b.disqualified?`<span style="color:var(--text3)">${b.spots}</span>`:`${b.spots}/${b.mxSpots} <b>+${b.r3p}</b>`);
  const r4c=bds.map(b=>{ if(!b.eligible)return na; if(b.bell===null||b.bell===undefined)return`<span class="pill pn">n/a</span>`; if(b.disqualified)return`<span style="color:var(--text3)">${bellLabel(b.bell)}</span>`; const cl=b.bell===2?'pp':b.bell===1?'pm':'pf'; return`<span class="pill ${cl}">${bellLabel(b.bell)}</span> <b>+${b.r4p}</b>`; });
  const r5c=bds.map(b=>{ if(!b.eligible)return na; if(b.disqualified)return`<span style="color:var(--text3)">${b.dist===999?'∞':b.dist}</span>`; return`${b.dist===999?'∞':b.dist} <b>+${b.r5p}</b>`; });
  const tc=bds.map(b=>!b.eligible?na:`<b>${b.finalStars}★</b>`);
  const hasDoor=LEVELS[currentLevel].doorIndex!==null&&LEVELS[currentLevel].doorIndex!==undefined;
  document.getElementById('debug-table').innerHTML=`<thead><tr><th class="rl"></th>${hc}</tr></thead><tbody>${row('status',sc)}${row('r1: buffer',r1c)}${row('r2: surround',r2c)}${row('r3: next spots',r3c)}${hasDoor?row('r4: zone',r4c):''}${row('r5: distance',r5c)}${row('total',tc)}</tbody>`;
}

  document.getElementById('stat-stars').textContent=totalStars;
  document.getElementById('stat-time').textContent=reactionTime!==null?(reactionTime/1000).toFixed(2)+'s':'—';
  document.getElementById('stat-best').textContent=bestReaction!==null?(bestReaction/1000).toFixed(2)+'s':'—';

// ── RENDER ────────────────────────────────────────────
function clickUrinal(i){
  if(revealed||countingDown)return;
  const{stalls,doorIndex}=LEVELS[currentLevel];
  if(stalls[i].status!=='empty')return;
  if(goTime!==null){ reactionTime=performance.now()-goTime; if(bestReaction===null||reactionTime<bestReaction)bestReaction=reactionTime; }
  picked=i; revealed=true; hoveredIdx=null;
  animatePlayerWalk(stalls,doorIndex,i,()=>{
    const w=gW();
    // Build pass map for all stalls
    const passMap=stalls.map((_,j)=>isPass(j,stalls,doorIndex,w));
    drawRoom(stalls,doorIndex,null,i,passMap,null);
    renderDebug();
    // In play mode for tutorial levels, only show rules introduced so far
    const rulesShown=(!isDebugMode&&currentLevel<5)?currentLevel+1:null;
    showScorePopup(i,stalls,doorIndex,w,rulesShown);
  });
}

function setupHover(){
  const svg=document.getElementById('room-svg');
  svg.addEventListener('mousemove',ev=>{
    const t=ev.target.closest('[onclick]');
    const m=t?.getAttribute('onclick')?.match(/clickUrinal\((\d+)\)/);
    const idx=m?+m[1]:null;
    if(idx!==hoveredIdx){ hoveredIdx=idx; if(!revealed&&!countingDown){ const{stalls,doorIndex}=LEVELS[currentLevel]; drawRoom(stalls,doorIndex,hoveredIdx,null,null,null); } }
  });
  svg.addEventListener('mouseleave',()=>{ hoveredIdx=null; if(!revealed&&!countingDown){ const{stalls,doorIndex}=LEVELS[currentLevel]; drawRoom(stalls,doorIndex,null,null,null,null); } });
}

function renderLevel(){
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  countingDown=false; goTime=null; reactionTime=null;
  LEVELS[currentLevel].stalls=ORIGINAL_STALLS[currentLevel].map(s=>({...s}));
  picked=null; revealed=false; hoveredIdx=null;
  document.getElementById('score-popup').classList.remove('show');
  document.getElementById('next-btn').style.display='none';
  document.getElementById('retry-btn').style.display='none';
  hideCD();
  if(isDebugMode){ renderNav(); updateDebugStats(); }
  drawRoom(LEVELS[currentLevel].stalls,LEVELS[currentLevel].doorIndex,null,null,null,null);
  renderDebug();
  setTimeout(()=>runCountdown(LEVELS[currentLevel]),600);
}

function nextLevel(){ currentLevel=(currentLevel+1)%LEVELS.length; renderLevel(); }
function retryLevel(){ renderLevel(); }

setupHover();
</script>
</body>
</html>
